name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build Docker image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: legacy-php-apache:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test image
        run: |
          docker run --rm legacy-php-apache:ci php -v
          docker run --rm legacy-php-apache:ci php -m | grep -qx gd
          docker run --rm legacy-php-apache:ci php -m | grep -qx soap
          docker run --rm legacy-php-apache:ci php -m | grep -qx pdo_mysql
